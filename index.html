<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام المحاسب المتكامل</title>
    <style>
        :root { --main: #1e293b; --accent: #0284c7; --bg: #f1f5f9; --white: #ffffff; --danger: #e11d48; --success: #10b981; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; color: #1e293b; }
        header { background: var(--main); color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        .page { display: none; padding: 20px; }
        .page.active { display: block; }
        .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; text-align: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .table-container { background: white; padding: 15px; border-radius: 8px; overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #e2e8f0; text-align: center; }
        input { width: 90%; padding: 5px; border: 1px solid #ccc; border-radius: 4px; }
        .btn { padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; color: white; }
        .btn-save { background: var(--success); }
        .btn-del { background: var(--danger); }
        .btn-nav { background: var(--main); margin-bottom: 10px; }
        #loader { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.8); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .auth-box { max-width: 350px; margin: 80px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
    </style>
</head>
<body>

<div id="loader"><h3>⏳ جاري الاتصال بالسحاب...</h3></div>

<div id="authScreen" class="auth-box">
    <h2>🔐 دخول النظام</h2>
    <input type="text" id="username" placeholder="اسم المستخدم" style="margin-bottom:10px; width:100%; padding:10px;"><br>
    <input type="password" id="password" placeholder="كلمة المرور" style="margin-bottom:20px; width:100%; padding:10px;"><br>
    <button class="btn btn-save" style="width:100%" onclick="handleAuth(true)">تسجيل الدخول</button>
    <p style="font-size:12px; color:gray; margin-top:15px;">أو <a href="#" onclick="handleAuth(false)">إنشاء حساب جديد</a></p>
</div>

<div id="appScreen" style="display:none;">
    <header>
        <h3 id="userDisplay">المحاسب الذكي</h3>
        <div>
            <button class="btn btn-save" onclick="syncData()">☁️ حفظ</button>
            <button class="btn btn-del" onclick="location.reload()">🚪 خروج</button>
        </div>
    </header>

    <div id="homePage" class="page active">
        <div class="card-grid">
            <div class="card" onclick="openPage('journalPage')"><h3>📓 اليومية</h3></div>
            <div class="card" onclick="openPage('accountsPage')"><h3>📁 الحسابات</h3></div>
            <div class="card" onclick="openPage('trialPage')"><h3>⚖️ الميزان</h3></div>
            <div class="card" onclick="openPage('stockPage')"><h3>📦 المخزن</h3></div>
        </div>
    </div>

    <div id="journalPage" class="page">
        <button class="btn btn-nav" onclick="openPage('homePage')">🔙 رجوع</button>
        <button class="btn btn-save" onclick="addRow('j')">+ قيد جديد</button>
        <div class="table-container">
            <table>
                <thead><tr><th>التاريخ</th><th>مدين</th><th>دائن</th><th>البيان</th><th>المبلغ</th><th>الصنف</th><th>الكمية</th><th>حذف</th></tr></thead>
                <tbody id="journalBody"></tbody>
            </table>
        </div>
    </div>

    <div id="accountsPage" class="page">
        <button class="btn btn-nav" onclick="openPage('homePage')">🔙 رجوع</button>
        <button class="btn btn-save" onclick="addRow('a')">+ حساب جديد</button>
        <div class="table-container">
            <table><thead><tr><th>اسم الحساب</th><th>النوع</th><th>حذف</th></tr></thead><tbody id="accountsBody"></tbody></table>
        </div>
    </div>

    <div id="trialPage" class="page"><button class="btn btn-nav" onclick="openPage('homePage')">🔙 رجوع</button><div class="table-container" id="trialResult"></div></div>
    <div id="stockPage" class="page"><button class="btn btn-nav" onclick="openPage('homePage')">🔙 رجوع</button><div class="table-container" id="stockResult"></div></div>
</div>

<datalist id="accList"></datalist>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const config = {
        apiKey: "AIzaSyBP7HP1w4MbOFZWnv7BdpKwDlYjv4VJUTM",
        authDomain: "accountsite26.firebaseapp.com",
        databaseURL: "https://accountsite26-default-rtdb.firebaseio.com",
        projectId: "accountsite26",
        appId: "1:1015795938039:web:b625e24fca2c5b231d19f2"
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let currentUser = "";
    let userDB = { journal: [], accounts: [] };

    window.handleAuth = async (isLogin) => {
        const u = document.getElementById('username').value.trim().toLowerCase();
        const p = document.getElementById('password').value.trim();
        if(!u || !p) return alert("أكمل البيانات");

        document.getElementById('loader').style.display = 'flex';
        try {
            const userRef = ref(db, 'users/' + u);
            const snap = await get(userRef);

            if(isLogin) {
                if(snap.exists() && snap.val().password === p) {
                    currentUser = u;
                    userDB = snap.val().data || { journal:[], accounts:[] };
                    startApp();
                } else alert("خطأ في البيانات");
            } else {
                if(snap.exists()) alert("الاسم مستخدم");
                else {
                    await set(userRef, { password: p, data: { journal:[], accounts:[] } });
                    currentUser = u;
                    userDB = { journal:[], accounts:[] };
                    startApp();
                }
            }
        } catch(e) { alert("خطأ في الاتصال"); }
        document.getElementById('loader').style.display = 'none';
    };

    function startApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appScreen').style.display = 'block';
        document.getElementById('userDisplay').innerText = "👤 " + currentUser;
        renderAll();
    }

    window.openPage = (id) => {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'trialPage') renderTrial();
        if(id === 'stockPage') renderStock();
    };

    window.addRow = (type) => {
        if(type === 'j') userDB.journal.push({ d: new Date().toISOString().split('T')[0], deb: '', cre: '', n: '', v: 0, p: '', q: 0 });
        else userDB.accounts.push({ n: '', t: 'أصول' });
        renderAll();
    };

    window.delRow = (type, i) => {
        if(type === 'j') userDB.journal.splice(i, 1);
        else userDB.accounts.splice(i, 1);
        renderAll();
    };

    function renderAll() {
        const jb = document.getElementById('journalBody'); jb.innerHTML = '';
        userDB.journal.forEach((r, i) => {
            jb.innerHTML += `<tr>
                <td><input type="date" value="${r.d}" onchange="userDB.journal[${i}].d=this.value"></td>
                <td><input list="accList" value="${r.deb}" onchange="userDB.journal[${i}].deb=this.value"></td>
                <td><input list="accList" value="${r.cre}" onchange="userDB.journal[${i}].cre=this.value"></td>
                <td><input value="${r.n}" onchange="userDB.journal[${i}].n=this.value"></td>
                <td><input type="number" value="${r.v}" onchange="userDB.journal[${i}].v=Number(this.value)"></td>
                <td><input value="${r.p}" onchange="userDB.journal[${i}].p=this.value"></td>
                <td><input type="number" value="${r.q}" onchange="userDB.journal[${i}].q=Number(this.value)"></td>
                <td><button class="btn-del" onclick="delRow('j',${i})">X</button></td>
            </tr>`;
        });

        const ab = document.getElementById('accountsBody'); ab.innerHTML = '';
        userDB.accounts.forEach((a, i) => {
            ab.innerHTML += `<tr>
                <td><input value="${a.n}" onchange="userDB.accounts[${i}].n=this.value; updateList()"></td>
                <td><select onchange="userDB.accounts[${i}].t=this.value">${['أصول','خصوم','إيراد','مصروف'].map(t=>`<option ${a.t==t?'selected':''}>${t}</option>`).join('')}</select></td>
                <td><button class="btn-del" onclick="delRow('a',${i})">X</button></td>
            </tr>`;
        });
        updateList();
    }

    function updateList() {
        document.getElementById('accList').innerHTML = userDB.accounts.map(a => `<option value="${a.n}">`).join('');
    }

    window.syncData = async () => {
        document.getElementById('loader').style.display = 'flex';
        await set(ref(db, `users/${currentUser}/data`), userDB);
        document.getElementById('loader').style.display = 'none';
        alert("✅ تم الحفظ");
    };

    function renderTrial() {
        const bal = {};
        userDB.journal.forEach(j => {
            if(j.deb) bal[j.deb] = (bal[j.deb] || 0) + j.v;
            if(j.cre) bal[j.cre] = (bal[j.cre] || 0) - j.v;
        });
        let h = '<h3>⚖️ ميزان المراجعة</h3><table><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr>';
        for(let a in bal) h += `<tr><td>${a}</td><td>${bal[a]>0?bal[a]:0}</td><td>${bal[a]<0?Math.abs(bal[a]):0}</td></tr>`;
        document.getElementById('trialResult').innerHTML = h + '</table>';
    }

    function renderStock() {
        const st = {};
        userDB.journal.forEach(j => { if(j.p) st[j.p] = (st[j.p] || 0) + j.q; });
        let h = '<h3>📦 رصيد الأصناف</h3><table><tr><th>الصنف</th><th>الكمية</th></tr>';
        for(let p in st) h += `<tr><td>${p}</td><td>${st[p]}</td></tr>`;
        document.getElementById('stockResult').innerHTML = h + '</table>';
    }
</script>
</body>
</html>
