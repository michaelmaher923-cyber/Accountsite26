<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSM Ultimate Edition - v1.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* === تصميم الواجهة الاحترافي === */
        :root {
            --bg-dark: #0a0f18; --card-bg: #161e2d; --accent: #007bff;
            --success: #00c853; --warning: #ffd600; --danger: #ff1744;
            --text-main: #ffffff; --text-dim: #94a3b8; --pitch-green: #2e7d32;
        }

        body { font-family: 'Cairo', sans-serif; background: var(--bg-dark); color: var(--text-main); margin: 0; overflow: hidden; }
        .wrapper { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }

        /* القائمة الجانبية */
        aside { background: var(--card-bg); border-left: 1px solid #2d3748; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .logo { font-size: 24px; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 30px; border-bottom: 2px solid #2d3748; padding-bottom: 15px; }
        .nav-link { padding: 14px 20px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: var(--text-dim); }
        .nav-link:hover { background: rgba(0, 123, 255, 0.1); color: white; }
        .nav-link.active { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3); }

        /* منطقة المحتوى */
        main { padding: 25px; overflow-y: auto; background-image: radial-gradient(circle at top right, #1a202c, #0a0f18); }
        .header-stats { display: flex; justify-content: space-between; margin-bottom: 25px; }
        .stat-pill { background: var(--card-bg); padding: 10px 20px; border-radius: 50px; border: 1px solid #2d3748; display: flex; align-items: center; gap: 10px; }

        /* الملعب والمحاكاة */
        .match-view { display: grid; grid-template-columns: 1fr 350px; gap: 20px; }
        .pitch { 
            background: var(--pitch-green); aspect-ratio: 16/9; border-radius: 20px; border: 5px solid rgba(255,255,255,0.2);
            position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .pitch-lines { position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.3); margin: 20px; }
        .center-circle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100px; height: 100px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; }
        
        .player-node { width: 30px; height: 30px; border-radius: 50%; position: absolute; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); border: 3px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .ball { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; z-index: 100; transition: 0.5s; filter: drop-shadow(0 0 5px white); }

        /* كروت اللاعبين */
        .player-card { background: linear-gradient(135deg, #1e293b, #0f172a); border-radius: 15px; padding: 15px; border: 1px solid #334155; position: relative; transition: 0.3s; }
        .player-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .p-power { font-size: 28px; font-weight: 900; color: var(--accent); position: absolute; top: 10px; left: 15px; }
        .p-pos { font-size: 12px; background: var(--accent); padding: 2px 8px; border-radius: 4px; }

        /* الجداول */
        table { width: 100%; border-spacing: 0; background: var(--card-bg); border-radius: 15px; overflow: hidden; }
        th { background: #1e293b; padding: 15px; text-align: right; color: var(--text-dim); }
        td { padding: 15px; border-bottom: 1px solid #2d3748; }

        /* التكتيكات */
        .tactics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .range-slider { width: 100%; accent-color: var(--accent); }

        /* أنيميشن */
        @keyframes goalScale { 0% { transform: scale(1); } 50% { transform: scale(1.5); color: gold; } 100% { transform: scale(1); } }
        .goal-anim { animation: goalScale 1s ease; }
    </style>
</head>
<body>

<div class="wrapper">
    <aside>
        <div class="logo">OSM ULTIMATE</div>
        <nav>
            <div class="nav-link active" onclick="switchPage('home')"><i class="fas fa-th-large"></i> لوحة التحكم</div>
            <div class="nav-link" onclick="switchPage('squad')"><i class="fas fa-users-viewfinder"></i> التشكيلة</div>
            <div class="nav-link" onclick="switchPage('tactics')"><i class="fas fa-chess-knight"></i> التكتيكات</div>
            <div class="nav-link" onclick="switchPage('training')"><i class="fas fa-dumbbell"></i> مركز التدريب</div>
            <div class="nav-link" onclick="switchPage('market')"><i class="fas fa-handshake"></i> سوق الانتقالات</div>
            <div class="nav-link" onclick="switchPage('match')"><i class="fas fa-gamepad"></i> المباراة المباشرة</div>
        </nav>
        <div style="margin-top: auto;">
            <div class="stat-pill"><i class="fas fa-wallet" style="color:var(--success)"></i> <span id="balance">0</span></div>
        </div>
    </aside>

    <main>
        <div class="header-stats">
            <h1 id="team-name-title">نادي الأساطير</h1>
            <div id="live-timer" style="font-size: 24px; font-weight: 900; color: var(--accent);">00:00</div>
        </div>

        <div id="page-home" class="page-content">
            <div style="display:grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>المباراة القادمة</h3>
                    <div style="display:flex; justify-content:space-around; align-items:center; padding:30px;">
                        <div style="text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/824/824727.png" width="80"><h2 id="home-name">فريقك</h2></div>
                        <div style="font-size:40px; font-weight:900;">VS</div>
                        <div style="text-align:center;"><img src="https://cdn-icons-png.flaticon.com/512/824/824742.png" width="80"><h2 id="away-name">الخصم</h2></div>
                    </div>
                </div>
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>أخبار النادي</h3>
                    <ul id="news-feed" style="list-style:none; padding:0; color:var(--text-dim);"></ul>
                </div>
            </div>
        </div>

        <div id="page-squad" class="page-content" style="display:none;">
            <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;" id="squad-list"></div>
        </div>

        <div id="page-tactics" class="page-content" style="display:none;">
            <div class="tactics-grid">
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>العقلية هجومية</h3>
                    <input type="range" class="range-slider" id="t-mentality">
                    <p>المخاطرة: <span id="v-mentality">50</span>%</p>
                </div>
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>الضغط العالي</h3>
                    <input type="range" class="range-slider" id="t-pressing">
                    <p>الشدة: <span id="v-pressing">50</span>%</p>
                </div>
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px;">
                    <h3>إيقاع اللعب</h3>
                    <input type="range" class="range-slider" id="t-tempo">
                    <p>السرعة: <span id="v-tempo">50</span>%</p>
                </div>
            </div>
            <button class="nav-link active" style="margin-top:20px; border:none; width:100%; justify-content:center;" onclick="saveTactics()">حفظ التكتيكات</button>
        </div>

        <div id="page-match" class="page-content" style="display:none;">
            <div class="match-view">
                <div class="pitch" id="live-pitch">
                    <div class="pitch-lines"></div>
                    <div class="center-circle"></div>
                    <div class="ball" id="match-ball"></div>
                    </div>
                <div class="card" style="background:var(--card-bg); padding:20px; border-radius:15px; height: 500px; overflow-y:auto;">
                    <h3>أحداث المباراة</h3>
                    <div id="match-events" style="font-family: monospace; font-size:13px;"></div>
                </div>
            </div>
            <button class="nav-link active" style="margin-top:20px; border:none;" onclick="startEngine()">انطلاق المباراة</button>
        </div>
    </main>
</div>

<script type="module">
    // --- الربط مع FIREBASE (الإعدادات) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        databaseURL: "YOUR_DB_URL",
        projectId: "YOUR_PROJECT_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const USER_ID = "coach_001"; // تجريبي

    // --- قاعدة بيانات اللاعبين الافتراضية ---
    const BASE_PLAYERS = [
        { id: 1, name: "ميسي", pos: "FW", power: 95, fit: 1.0, morale: 0.9, price: 120000000 },
        { id: 2, name: "صلاح", pos: "FW", power: 92, fit: 1.0, morale: 0.8, price: 90000000 },
        { id: 3, name: "دي بروين", pos: "MF", power: 91, fit: 0.9, morale: 0.9, price: 85000000 },
        { id: 4, name: "فان دايك", pos: "DF", power: 90, fit: 1.0, morale: 0.9, price: 75000000 },
        { id: 5, name: "كورتوا", pos: "GK", power: 91, fit: 1.0, morale: 0.8, price: 60000000 }
    ];

    // --- متغيرات اللعبة (State) ---
    let myClub = null;
    let opponent = { name: "ريال مدريد", power: 88 };
    let matchIsRunning = false;

    // --- المحرك الرئيسي (Engine) ---

    // 1. تحميل البيانات
    async function initApp() {
        const snap = await get(ref(db, `clubs/${USER_ID}`));
        if (!snap.exists()) {
            // إنشاء نادي جديد إذا لم يوجد
            myClub = {
                name: "نادي الأساطير",
                balance: 50000000,
                players: BASE_PLAYERS,
                tactics: { mentality: 70, pressing: 60, tempo: 80 },
                stadium: { level: 1, capacity: 10000 }
            };
            await set(ref(db, `clubs/${USER_ID}`), myClub);
        } else {
            myClub = snap.val();
        }
        updateUI();
    }

    // 2. تحديث الواجهة
    function updateUI() {
        document.getElementById('balance').innerText = myClub.balance.toLocaleString() + " $";
        document.getElementById('team-name-title').innerText = myClub.name;
        
        // عرض التشكيلة
        const squadList = document.getElementById('squad-list');
        squadList.innerHTML = myClub.players.map(p => `
            <div class="player-card">
                <div class="p-power">${p.power}</div>
                <div class="p-pos">${p.pos}</div>
                <h4 style="margin:40px 0 10px 0">${p.name}</h4>
                <div style="height:4px; background:#334155; border-radius:2px;">
                    <div style="width:${p.fit * 100}%; height:100%; background:var(--success);"></div>
                </div>
                <small style="color:var(--text-dim)">اللياقة البدنية</small>
            </div>
        `).join('');
    }

    // 3. محرك المباراة (Live Simulation)
    window.startEngine = async function() {
        if (matchIsRunning) return;
        matchIsRunning = true;
        
        let score = [0, 0];
        const ball = document.getElementById('match-ball');
        const events = document.getElementById('match-events');
        const timer = document.getElementById('live-timer');
        
        events.innerHTML = `<div style="color:var(--success)">[00:00] صافرة البداية تنطلق في ملعب المباراة!</div>`;
        
        for (let min = 1; min <= 90; min++) {
            await new Promise(r => setTimeout(r, 200)); // محاكاة كل دقيقة
            timer.innerText = (min < 10 ? '0' : '') + min + ":00";

            // تحريك الكرة بصرياً
            ball.style.left = Math.random() * 90 + "%";
            ball.style.top = Math.random() * 90 + "%";

            // معادلة الحساب المعقدة
            // (متوسط قوة الفريق * التكتيك * اللياقة) + الحظ العشوائي
            let myPower = calculateLivePower() * (myClub.tactics.mentality / 50) + (Math.random() * 15);
            let oppPower = opponent.power + (Math.random() * 15);

            // احتمال وقوع هجمة
            if (Math.random() > 0.95) {
                if (myPower > oppPower + 5) {
                    score[0]++;
                    updateScores(score);
                    events.innerHTML = `<div class="goal-anim">[${min}:00] جـووووول! ${myClub.players[Math.floor(Math.random()*5)].name} يسجل! ⚽</div>` + events.innerHTML;
                } else if (oppPower > myPower + 10) {
                    score[1]++;
                    updateScores(score);
                    events.innerHTML = `<div style="color:var(--danger)">[${min}:00] هدف للخصم! دفاعنا يتراخى.. ❌</div>` + events.innerHTML;
                } else {
                    events.innerHTML = `<div>[${min}:00] هجمة خطيرة ضاعت من المهاجم.</div>` + events.innerHTML;
                }
            }

            // إصابات عشوائية
            if (Math.random() > 0.99) {
                events.innerHTML = `<div style="color:var(--warning)">[${min}:00] إصابة لأحد اللاعبين وتدخل الطاقم الطبي! 🚑</div>` + events.innerHTML;
            }
        }

        matchIsRunning = false;
        finishMatch(score);
    };

    function calculateLivePower() {
        return myClub.players.reduce((acc, p) => acc + (p.power * p.fit), 0) / myClub.players.length;
    }

    function updateScores(s) {
        document.getElementById('liveScoreA').innerText = s[0]; // تأكد من وجود ID في HTML
        // سيتم ربطه بـ HUD Score
    }

    async function finishMatch(score) {
        let reward = score[0] > score[1] ? 500000 : 100000;
        myClub.balance += reward;
        // تقليل اللياقة
        myClub.players.forEach(p => p.fit = Math.max(0.5, p.fit - 0.05));
        
        await update(ref(db, `clubs/${USER_ID}`), {
            balance: myClub.balance,
            players: myClub.players
        });
        alert(`انتهت المباراة! النتيجة ${score[0]}-${score[1]}. حصلت على مكافأة: ${reward}$`);
        updateUI();
    }

    // 4. نظام التبويب
    window.switchPage = (page) => {
        document.querySelectorAll('.page-content').forEach(p => p.style.display = 'none');
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        document.getElementById(`page-${page}`).style.display = 'block';
        event.currentTarget.classList.add('active');
    }

    // --- بدء التطبيق ---
    initApp();

</script>
</body>
</html>
